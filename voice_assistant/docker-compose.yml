services:
  lentswe:
    build: .
    ports:
      - "7000:7000"
    environment:
      LENTSWE_DATA_DIR: /app/data
      LENTSWE_HOST: 0.0.0.0
      PORT: "7000"
      LOG_LEVEL: INFO
    volumes:
      - lentswe-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:7000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  lentswe-data:
